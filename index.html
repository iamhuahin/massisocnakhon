<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ระดมพล | กอ.รมน.จังหวัด น.ศ.</title>
  <meta name="apple-mobile-web-app-title" content="ระดมพล" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="application-name" content="ระดมพล" />
  <meta name="theme-color" content="#0b1120" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="apple-touch-icon" href="logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css" />
  <style>
    :root {
      --bg: #0b1120;
      --surface: #151e32;
      --surface-2: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --phet: #38bdf8;
      --tsps: #34d399;
      --wisdom: #fbbf24;
      --danger: #ef4444;
      --success: #22c55e;
      --radius: 14px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: 'Sarabun', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 84px;
    }

    /* Login Screen */
    #loginScreen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at top, #1e293b 0%, #0b1120 75%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }
    .login-card {
      width: 100%;
      max-width: 390px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 30px 24px 26px;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0,0,0,0.55);
    }
    .login-logo {
      width: 88px;
      height: 88px;
      object-fit: contain;
      margin: 0 auto 12px;
      display: block;
      filter: drop-shadow(0 4px 14px rgba(0,0,0,0.5));
    }
    .login-badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 99px;
      background: rgba(59,130,246,0.14);
      border: 1px solid rgba(96,165,250,0.28);
      color: #93c5fd;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 10px;
    }
    .app-hero-title {
      margin: 2px 0 4px;
      font-size: 42px;
      font-weight: 800;
      letter-spacing: 2px;
      line-height: 1.15;
      background: linear-gradient(135deg, #ffffff 0%, #38bdf8 48%, #fbbf24 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 3px 12px rgba(56, 189, 248, 0.25));
    }
    .app-hero-sub {
      margin: 0 0 6px;
      font-size: 16px;
      font-weight: 600;
      color: #e2e8f0;
    }
    .login-card p.login-hint {
      margin: 0 0 22px;
      font-size: 13.5px;
      color: var(--muted);
    }
    .input-pin {
      width: 100%;
      padding: 14px 16px;
      font-size: 18px;
      text-align: center;
      letter-spacing: 3px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      outline: none;
      margin-bottom: 14px;
      font-family: inherit;
    }
    .input-pin:focus { border-color: var(--primary); }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 18px;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
    }
    .btn-primary {
      width: 100%;
      background: var(--primary);
      color: #fff;
    }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-install {
      width: 100%;
      margin-top: 10px;
      background: rgba(52, 211, 153, 0.14);
      color: #34d399;
      border: 1px solid rgba(52, 211, 153, 0.35);
      display: none;
    }
    .btn-install:hover { background: rgba(52, 211, 153, 0.24); }
    .login-error {
      margin-top: 12px;
      color: #f87171;
      font-size: 14px;
      min-height: 20px;
    }

    /* Header */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(11, 17, 32, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .topbar-logo {
      width: 34px;
      height: 34px;
      object-fit: contain;
      flex-shrink: 0;
    }
    .topbar-title {
      font-size: 18px;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: 0.5px;
      color: #fff;
    }
    .topbar-sub {
      font-size: 11.5px;
      color: var(--muted);
    }
    .role-pill {
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 99px;
      font-weight: 600;
      white-space: nowrap;
    }
    .role-user { background: rgba(56,189,248,0.15); color: var(--phet); }
    .role-admin { background: rgba(251,191,36,0.18); color: var(--wisdom); }
    .btn-logout {
      background: var(--surface-2);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 6px 11px;
      font-size: 13px;
      border-radius: 10px;
      cursor: pointer;
      font-family: inherit;
    }

    /* Main Container */
    .container {
      max-width: 820px;
      margin: 0 auto;
      padding: 14px;
    }
    .view-section { display: none; }
    .view-section.active { display: block; }

    /* Filters */
    .filter-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 14px;
      display: grid;
      gap: 10px;
    }
    .filter-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    @media (max-width: 480px) {
      .filter-row { grid-template-columns: 1fr; }
    }
    label.field-label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    select, input[type="text"], textarea {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: inherit;
      font-size: 15px;
      outline: none;
    }
    select:focus, input[type="text"]:focus, textarea:focus {
      border-color: var(--primary);
    }

    .result-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 4px 2px 10px;
      font-size: 13px;
      color: var(--muted);
    }

    /* Network Sub-Tabs */
    .subtabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    .subtab-btn {
      padding: 10px 6px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }
    .subtab-btn.active[data-net="phet"]   { background: rgba(56,189,248,0.16); color: var(--phet); border-color: var(--phet); }
    .subtab-btn.active[data-net="tsps"]   { background: rgba(52,211,153,0.16); color: var(--tsps); border-color: var(--tsps); }
    .subtab-btn.active[data-net="wisdom"] { background: rgba(251,191,36,0.16); color: var(--wisdom); border-color: var(--wisdom); }

    /* Person Card */
    .card-list { display: grid; gap: 12px; }
    .person-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .avatar-wrap {
      width: 78px;
      aspect-ratio: 3 / 4;
      flex-shrink: 0;
      border-radius: 10px;
      overflow: hidden;
      background: var(--bg);
      border: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .avatar-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .avatar-placeholder {
      width: 42px;
      height: 42px;
      opacity: 0.35;
      color: var(--muted);
    }
    .card-body { flex: 1; min-width: 0; }
    .net-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      margin-bottom: 4px;
    }
    .tag-phet   { background: rgba(56,189,248,0.15); color: var(--phet); }
    .tag-tsps   { background: rgba(52,211,153,0.15); color: var(--tsps); }
    .tag-wisdom { background: rgba(251,191,36,0.15); color: var(--wisdom); }

    .person-name {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      word-break: break-word;
    }
    .detail-list {
      margin-top: 6px;
      display: grid;
      gap: 3px;
      font-size: 13.5px;
      color: #cbd5e1;
    }
    .detail-list span.lbl { color: var(--muted); }
    .card-actions {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .btn-call {
      background: rgba(34,197,94,0.16);
      color: #4ade80;
      border: 1px solid rgba(34,197,94,0.35);
      padding: 7px 12px;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-edit {
      background: rgba(251,191,36,0.14);
      color: var(--wisdom);
      border: 1px solid rgba(251,191,36,0.35);
      padding: 7px 12px;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }

    /* Dashboard */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    @media (min-width: 600px) {
      .stat-grid { grid-template-columns: repeat(4, 1fr); }
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
    }
    .stat-card .s-lbl { font-size: 12.5px; color: var(--muted); }
    .stat-card .s-val { font-size: 26px; font-weight: 700; margin-top: 2px; }
    .dist-acc {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 8px;
      overflow: hidden;
    }
    .dist-header {
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      gap: 8px;
    }
    .dist-name { font-weight: 600; font-size: 15px; }
    .dist-badges { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
    .mini-badge {
      font-size: 12px;
      padding: 2px 7px;
      border-radius: 6px;
      font-weight: 600;
    }
    .subdist-body {
      display: none;
      border-top: 1px solid var(--border);
      background: rgba(11,17,32,0.5);
      padding: 8px 14px;
    }
    .dist-acc.open .subdist-body { display: block; }
    .subdist-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px dashed rgba(51,65,85,0.6);
      font-size: 13.5px;
    }
    .subdist-row:last-child { border-bottom: none; }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(21, 30, 50, 0.96);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      z-index: 200;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .nav-item {
      background: none;
      border: none;
      color: var(--muted);
      padding: 10px 4px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }
    .nav-item.active { color: var(--primary); }
    .nav-item svg { width: 22px; height: 22px; }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.78);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 500;
      overflow-y: auto;
    }
    .modal-backdrop.open { display: flex; }
    .modal-box {
      width: 100%;
      max-width: 480px;
      max-height: 92vh;
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
    }
    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .modal-head h2 { margin: 0; font-size: 18px; }
    .btn-close {
      background: var(--surface-2);
      border: none;
      color: var(--text);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
    }
    .form-grid { display: grid; gap: 10px; }
    .crop-container {
      width: 100%;
      max-height: 280px;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 8px;
      display: none;
    }
    .crop-container img { max-width: 100%; display: block; }
    .photo-preview-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }
    .photo-preview-box {
      width: 66px;
      aspect-ratio: 3 / 4;
      border-radius: 8px;
      overflow: hidden;
      background: var(--bg);
      border: 1px solid var(--border);
      flex-shrink: 0;
    }
    .photo-preview-box img { width: 100%; height: 100%; object-fit: cover; }

    /* Lightbox */
    #lightboxModal img {
      max-width: 90vw;
      max-height: 82vh;
      border-radius: 14px;
      border: 2px solid var(--border);
    }

    .empty-state {
      text-align: center;
      padding: 42px 18px;
      color: var(--muted);
      font-size: 15px;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
    }
  </style>
</head>
<body>

<!-- ==================== LOGIN SCREEN ==================== -->
<div id="loginScreen">
  <div class="login-card">
    <img src="logo.png" alt="โลโก้ กอ.รมน." class="login-logo" />
    <div class="login-badge">กอ.รมน.จังหวัดนครศรีธรรมราช</div>
    <h1 class="app-hero-title">ระดมพล</h1>
    <div class="app-hero-sub">ระบบฐานข้อมูลเครือข่ายมวลชน</div>
    <p class="login-hint">กรุณากรอกรหัสผ่านเจ้าหน้าที่เพื่อเข้าใช้งาน</p>
    <input type="password" id="pinInput" class="input-pin" placeholder="กรอกรหัสผ่าน" autocomplete="off" />
    <button id="loginBtn" class="btn btn-primary" onclick="handleLogin()">เข้าสู่ระบบ</button>
    <button id="installPwaBtn" class="btn btn-install" onclick="handleInstallPwa()">📲 ติดตั้งแอป "ระดมพล" ลงมือถือ</button>
    <div id="loginError" class="login-error"></div>
  </div>
</div>

<!-- ==================== MAIN APP ==================== -->
<div id="appShell" style="display:none;">
  <header class="topbar">
    <div class="topbar-brand">
      <img src="logo.png" alt="กอ.รมน." class="topbar-logo" />
      <div>
        <div class="topbar-title">ระดมพล</div>
        <div class="topbar-sub">เครือข่ายมวลชน กอ.รมน.จังหวัด น.ศ.</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <span id="roleBadge" class="role-pill role-user">เจ้าหน้าที่</span>
      <button class="btn-logout" onclick="handleLogout()">ออก</button>
    </div>
  </header>

  <main class="container">
    <!-- VIEW 1: AREA SEARCH -->
    <section id="view-search" class="view-section active">
      <div class="filter-box">
        <div class="filter-row">
          <div>
            <label class="field-label">ประเภทเครือข่าย</label>
            <select id="filterType" onchange="onTypeChange()">
              <option value="">-- เลือกประเภทเครือข่าย --</option>
              <option value="phet">ครูเพชรในตม</option>
              <option value="tsps">สมาชิก ทสปช.</option>
              <option value="wisdom">ปราชญ์เพื่อความมั่นคง</option>
            </select>
          </div>
          <div id="subLevelWrap" style="display:none;">
            <label class="field-label" id="subLevelLabel">ระดับ / กลุ่มย่อย</label>
            <select id="filterSubLevel" onchange="renderAreaSearch()">
              <option value="">ทั้งหมด</option>
            </select>
          </div>
        </div>
        <div class="filter-row">
          <div>
            <label class="field-label">อำเภอ</label>
            <select id="filterDistrict" onchange="onDistrictChange()">
              <option value="">ทั้งหมดทุกอำเภอ</option>
            </select>
          </div>
          <div>
            <label class="field-label">ตำบล</label>
            <select id="filterSubdistrict" onchange="renderAreaSearch()">
              <option value="">ทั้งหมดทุกตำบล</option>
            </select>
          </div>
        </div>
        <div>
          <label class="field-label">คำค้นหา (ชื่อ / นามสกุล / ตำแหน่ง / องค์ความรู้)</label>
          <input type="text" id="filterQuery" placeholder="พิมพ์คำค้นหา..." oninput="renderAreaSearch()" />
        </div>
      </div>
      <div class="result-bar">
        <span id="searchCount">กรุณาเลือกตัวกรองหรือพิมพ์คำค้นหา</span>
        <button class="btn-logout" onclick="resetSearchFilters()">ล้างตัวกรอง</button>
      </div>
      <div id="searchList" class="card-list"></div>
    </section>

    <!-- VIEW 2: NETWORK TABS -->
    <section id="view-networks" class="view-section">
      <div class="subtabs">
        <button class="subtab-btn active" data-net="phet" onclick="switchNetworkTab('phet')">ครูเพชรในตม</button>
        <button class="subtab-btn" data-net="tsps" onclick="switchNetworkTab('tsps')">สมาชิก ทสปช.</button>
        <button class="subtab-btn" data-net="wisdom" onclick="switchNetworkTab('wisdom')">ปราชญ์ฯ</button>
      </div>
      <div class="filter-box">
        <div class="filter-row">
          <div>
            <label class="field-label" id="netSubLevelLabel">ระดับ / กลุ่มย่อย</label>
            <select id="netSubLevel" onchange="renderNetworkTab()">
              <option value="">ทั้งหมด</option>
            </select>
          </div>
          <div>
            <label class="field-label">ค้นหาในเครือข่าย</label>
            <input type="text" id="netQuery" placeholder="ชื่อ, อำเภอ, ตำบล..." oninput="renderNetworkTab()" />
          </div>
        </div>
      </div>
      <div class="result-bar">
        <span id="netCount">0 รายการ</span>
      </div>
      <div id="netList" class="card-list"></div>
    </section>

    <!-- VIEW 3: DASHBOARD -->
    <section id="view-dashboard" class="view-section">
      <div class="stat-grid" id="statGrid"></div>
      <div class="result-bar">
        <span>สรุปยอดรายอำเภอ (แตะเพื่อดูแยกตามตำบล)</span>
      </div>
      <div id="districtSummary"></div>
    </section>
  </main>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <button class="nav-item active" data-view="search" onclick="switchView('search')">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11A6 6 0 115 11a6 6 0 0112 0z"/></svg>
      ค้นหาพื้นที่
    </button>
    <button class="nav-item" data-view="networks" onclick="switchView('networks')">

<!-- ==================== PHOTO LIGHTBOX ==================== -->
<div id="lightboxModal" class="modal-backdrop" onclick="this.classList.remove('open')">
  <img id="lightboxImg" src="" alt="ภาพบุคคล" />
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbwujWi6oyNyPdCg3-bhKA0Ywgr9W_DIjugqUSS-S89BBM_Oyn9oyXW4UcsJKnzmweJ_/exec";

  const NON_GEO_DISTRICTS = ["ระดับจังหวัด / ที่ปรึกษา", "กลุ่มนิสิต (ยังไม่ระบุพื้นที่)", "ไม่ระบุอำเภอ"];
  const NON_GEO_SUBDISTRICTS = ["ระดับจังหวัด", "กลุ่มนิสิต", "-"];

  let allRecords = [];
  let currentRole = null;
  let currentPin = null;
  let currentNetTab = "phet";
  let editingRecord = null;
  let cropperInstance = null;
  let deferredPrompt = null;

  const AVATAR_SVG = `<svg class="avatar-placeholder" fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>`;

  // ==================== PWA INSTALL LOGIC ====================
  const isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  const isIos = /iphone|ipad|ipod/i.test(window.navigator.userAgent);

  window.addEventListener("beforeinstallprompt", e => {
    e.preventDefault();
    deferredPrompt = e;
    if (!isStandalone) {
      document.getElementById("installPwaBtn").style.display = "inline-flex";
    }
  });

  window.addEventListener("appinstalled", () => {
    deferredPrompt = null;
    document.getElementById("installPwaBtn").style.display = "none";
  });

  if (isIos && !isStandalone) {
    document.getElementById("installPwaBtn").style.display = "inline-flex";
  }

  async function handleInstallPwa() {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === "accepted") {
        document.getElementById("installPwaBtn").style.display = "none";
      }
      deferredPrompt = null;
    } else if (isIos) {
      alert('วิธีติดตั้งบน iPhone:\n1. แตะปุ่ม "แชร์" (ไอคอนลูกศรชี้ขึ้นด้านล่าง)\n2. เลื่อนลงมาเลือก "เพิ่มไปยังหน้าจอโฮม" (Add to Home Screen)\n3. กด "เพิ่ม" มุมขวาบน');
    }
  }

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
  }

  // ==================== LOGIN & APP ====================
  document.getElementById("pinInput").addEventListener("keydown", e => {
    if (e.key === "Enter") handleLogin();
  });

  window.addEventListener("DOMContentLoaded", () => {
    const savedPin = sessionStorage.getItem("isoc_ns_pin");
    if (savedPin) {
      document.getElementById("pinInput").value = savedPin;
      handleLogin();
    }
  });

  async function apiPost(payload) {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });
    return await res.json();
  }

  function classifySubLevel(r) {
    const pos = String(r.position || "");
    if (r.type === "phet") {
      if (pos.includes("ศึกษาปีที่") || !r.rawDistrict) return "นิสิต";
      if (pos.includes("ผู้อำนวยการ") || pos.includes("ผอ.")) return "ผู้บริหาร";
      return "ครูผู้สอน";
    }
    if (r.type === "tsps") {
      if (pos.includes("ที่ปรึกษา")) return "ที่ปรึกษา";
      if (!r.rawDistrict || r.district === "ระดับจังหวัด / ที่ปรึกษา") return "คณะกรรมการระดับจังหวัด";
      return "สมาชิก ทสปช. ทั่วไป";
    }
    if (r.type === "wisdom") {
      return r.branch || "ไม่ระบุสาขา";
    }
    return "";
  }

  function getSubLevelOptions(type) {
    if (type === "phet") {
      return ["ผู้บริหาร", "ครูผู้สอน", "นิสิต"];
    }
    if (type === "tsps") {
      return ["ที่ปรึกษา", "คณะกรรมการระดับจังหวัด", "สมาชิก ทสปช. ทั่วไป"];
    }
    if (type === "wisdom") {
      return [...new Set(
        allRecords.filter(r => r.type === "wisdom").map(r => r.subLevel).filter(Boolean)
      )].sort((a, b) => a.localeCompare(b, "th"));
    }
    return [];
  }

  function getSubLevelTitle(type) {
    if (type === "phet") return "ระดับเครือข่าย (ครูเพชรในตม)";
    if (type === "tsps") return "ระดับสมาชิก (ทสปช.)";
    if (type === "wisdom") return "สาขาความเชี่ยวชาญ (ปราชญ์ฯ)";
    return "ระดับ / กลุ่มย่อย";
  }

  async function handleLogin() {
    const pin = document.getElementById("pinInput").value.trim();
    const errEl = document.getElementById("loginError");
    const btn = document.getElementById("loginBtn");

    if (!pin) { errEl.textContent = "กรุณากรอกรหัสผ่าน"; return; }
    errEl.textContent = "";
    btn.disabled = true;
    btn.textContent = "กำลังตรวจสอบและโหลดข้อมูล...";

    try {
      const data = await apiPost({ action: "login", pin });
      if (!data.ok) {
        errEl.textContent = data.error || "รหัสผ่านไม่ถูกต้อง";
        sessionStorage.removeItem("isoc_ns_pin");
        return;
      }
      currentPin = pin;
      currentRole = data.role;
      allRecords = (data.records || []).map(r => ({ ...r, subLevel: classifySubLevel(r) }));
      sessionStorage.setItem("isoc_ns_pin", pin);

      const badge = document.getElementById("roleBadge");
      if (currentRole === "admin") {
        badge.textContent = "ผู้ดูแล (อัปเดตได้)";
        badge.className = "role-pill role-admin";
      } else {
        badge.textContent = "เจ้าหน้าที่";
        badge.className = "role-pill role-user";
      }

      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("appShell").style.display = "block";
      initFilters();
      populateNetSubLevel();
      renderAreaSearch();
      renderNetworkTab();
      renderDashboard();
    } catch (e) {
      errEl.textContent = "ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้ กรุณาลองใหม่";
    } finally {
      btn.disabled = false;
      btn.textContent = "เข้าสู่ระบบ";
    }
  }

  function handleLogout() {
    sessionStorage.removeItem("isoc_ns_pin");
    currentPin = null;
    currentRole = null;
    allRecords = [];
    document.getElementById("pinInput").value = "";
    document.getElementById("appShell").style.display = "none";
    document.getElementById("loginScreen").style.display = "flex";
  }

  function switchView(viewName) {
    document.querySelectorAll(".view-section").forEach(el => el.classList.remove("active"));
    document.getElementById("view-" + viewName).classList.add("active");
    document.querySelectorAll(".nav-item").forEach(el => {
      el.classList.toggle("active", el.dataset.view === viewName);
    });
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  // ==================== FILTERS (AREA SEARCH) ====================
  function getRealDistricts(typeFilter = "") {
    return [...new Set(
      allRecords
        .filter(r => (!typeFilter || r.type === typeFilter) && r.district && !NON_GEO_DISTRICTS.includes(r.district))
        .map(r => r.district)
    )].sort((a, b) => a.localeCompare(b, "th"));
  }

  function initFilters() {
    const type = document.getElementById("filterType").value;
    const distSelect = document.getElementById("filterDistrict");
    const prev = distSelect.value;
    const list = getRealDistricts(type);
    distSelect.innerHTML = `<option value="">ทั้งหมดทุกอำเภอ</option>` +
      list.map(d => `<option value="${esc(d)}">${esc(d)}</option>`).join("");
    if (prev && list.includes(prev)) distSelect.value = prev;
    populateSubdistricts();
  }

  function onTypeChange() {
    const type = document.getElementById("filterType").value;
    const wrap = document.getElementById("subLevelWrap");
    const sel  = document.getElementById("filterSubLevel");
    const lbl  = document.getElementById("subLevelLabel");

    if (type) {
      const opts = getSubLevelOptions(type);
      lbl.textContent = getSubLevelTitle(type);
      sel.innerHTML = `<option value="">ทั้งหมด</option>` +
        opts.map(o => `<option value="${esc(o)}">${esc(o)}</option>`).join("");
      wrap.style.display = "block";
    } else {
      sel.innerHTML = `<option value="">ทั้งหมด</option>`;
      wrap.style.display = "none";
    }

    initFilters();
    renderAreaSearch();
  }

  function onDistrictChange() {
    populateSubdistricts();
    renderAreaSearch();
  }

  function populateSubdistricts() {
    const type = document.getElementById("filterType").value;
    const dist = document.getElementById("filterDistrict").value;
    const subSelect = document.getElementById("filterSubdistrict");
    const subs = [...new Set(
      allRecords
        .filter(r => {
          if (type && r.type !== type) return false;
          if (dist && r.district !== dist) return false;
          return r.subdistrict && !NON_GEO_SUBDISTRICTS.includes(r.subdistrict);
        })
        .map(r => r.subdistrict)
    )].sort((a, b) => a.localeCompare(b, "th"));

    subSelect.innerHTML = `<option value="">ทั้งหมดทุกตำบล</option>` +
      subs.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join("");
  }

  function resetSearchFilters() {
    document.getElementById("filterType").value = "";
    document.getElementById("filterSubLevel").innerHTML = `<option value="">ทั้งหมด</option>`;
    document.getElementById("subLevelWrap").style.display = "none";
    document.getElementById("filterDistrict").value = "";
    document.getElementById("filterQuery").value = "";
    initFilters();
    renderAreaSearch();
  }

  // ==================== RENDER CARDS ====================
  function renderAreaSearch() {
    const type = document.getElementById("filterType").value;
    const subLv = document.getElementById("filterSubLevel").value;
    const dist = document.getElementById("filterDistrict").value;
    const sub  = document.getElementById("filterSubdistrict").value;
    const q    = document.getElementById("filterQuery").value.trim().toLowerCase();

    if (!type && !subLv && !dist && !sub && !q) {
      document.getElementById("searchCount").textContent = "กรุณาเลือกประเภทเครือข่าย พื้นที่ หรือพิมพ์คำค้นหา";
      document.getElementById("searchList").innerHTML =
        `<div class="empty-state">เลือกเงื่อนไขด้านบนเพื่อสืบค้นรายชื่อเครือข่ายมวลชน</div>`;
      return;
    }

    const list = allRecords.filter(r => {
      if (type && r.type !== type) return false;
      if (subLv && r.subLevel !== subLv) return false;
      if (dist && r.district !== dist) return false;
      if (sub && r.subdistrict !== sub) return false;
      if (q) {
        const hay = [
          r.prefix, r.firstName, r.lastName, r.position, r.workplace,
          r.branch, r.category, r.knowledge, r.subdistrict, r.district, r.phone, r.subLevel
        ].join(" ").toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    document.getElementById("searchCount").textContent = `พบ ${list.length} รายการ`;
    document.getElementById("searchList").innerHTML = list.length
      ? list.map(buildPersonCard).join("")
      : `<div class="empty-state">ไม่พบข้อมูลตามเงื่อนไขที่เลือก</div>`;
  }

  function switchNetworkTab(net) {
    currentNetTab = net;
    document.querySelectorAll(".subtab-btn").forEach(b => {
      b.classList.toggle("active", b.dataset.net === net);
    });
    populateNetSubLevel();
    renderNetworkTab();
  }

  function populateNetSubLevel() {
    const opts = getSubLevelOptions(currentNetTab);
    document.getElementById("netSubLevelLabel").textContent = getSubLevelTitle(currentNetTab);
    document.getElementById("netSubLevel").innerHTML = `<option value="">ทั้งหมด</option>` +
      opts.map(o => `<option value="${esc(o)}">${esc(o)}</option>`).join("");
  }

  function renderNetworkTab() {
    const subLv = document.getElementById("netSubLevel").value;
    const q = document.getElementById("netQuery").value.trim().toLowerCase();
    const list = allRecords.filter(r => {
      if (r.type !== currentNetTab) return false;
      if (subLv && r.subLevel !== subLv) return false;
      if (q) {
        const hay = [
          r.prefix, r.firstName, r.lastName, r.position, r.workplace,
          r.branch, r.category, r.knowledge, r.subdistrict, r.district, r.phone, r.subLevel
        ].join(" ").toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    document.getElementById("netCount").textContent = `พบ ${list.length} รายการ`;
    document.getElementById("netList").innerHTML = list.length
      ? list.map(buildPersonCard).join("")
      : `<div class="empty-state">ไม่พบข้อมูล</div>`;
  }

  function buildPersonCard(r) {
    const fullName = `${r.prefix}${r.firstName} ${r.lastName}`.trim();
    const tagClass = r.type === "phet" ? "tag-phet" : (r.type === "tsps" ? "tag-tsps" : "tag-wisdom");
    const avatarHtml = r.photoUrl
      ? `<img src="${esc(r.photoUrl)}" alt="${esc(fullName)}" loading="lazy" onclick="openLightbox('${esc(r.photoUrl)}')" />`
      : AVATAR_SVG;

    let details = "";
    if (r.type === "phet") {
      details = `
        <div><span class="lbl">รุ่นที่:</span> ${esc(r.batch || "-")} | <span class="lbl">ตำแหน่ง:</span> ${esc(r.position || "-")}</div>
        ${r.workplace ? `<div><span class="lbl">สถานที่ทำงาน:</span> ${esc(r.workplace)}</div>` : ""}
        <div><span class="lbl">พื้นที่:</span> ${r.rawDistrict ? `ต.${esc(r.subdistrict)} อ.${esc(r.district)}` : esc(r.subLevel)}</div>
      `;
    } else if (r.type === "tsps") {
      details = `
        <div><span class="lbl">ตำแหน่ง:</span> ${esc(r.position || "-")}</div>
        <div><span class="lbl">พื้นที่:</span> ${r.rawDistrict ? `ต.${esc(r.subdistrict)} อ.${esc(r.district)}` : esc(r.subLevel)}</div>
      `;
    } else {
      details = `
        <div><span class="lbl">ตำแหน่ง:</span> ${esc(r.position || "-")}</div>
        <div><span class="lbl">สาขา:</span> ${esc(r.branch || "-")} | <span class="lbl">ประเภท:</span> ${esc(r.category || "-")}</div>
        <div><span class="lbl">ความเชี่ยวชาญ:</span> ${esc(r.knowledge || "-")}</div>
        <div><span class="lbl">พื้นที่:</span> ต.${esc(r.subdistrict)} อ.${esc(r.district)}</div>
      `;
    }

    const callBtn = r.phoneTel
      ? `<a class="btn-call" href="tel:${esc(r.phoneTel)}">📞 โทร ${esc(r.phone)}</a>`
      : (r.phone ? `<span style="font-size:13px;color:var(--muted);">โทร: ${esc(r.phone)}</span>` : "");

    const editBtn = currentRole === "admin"
      ? `<button class="btn-edit" onclick="openEditModal('${esc(r.id)}')">✏️ อัปเดตข้อมูล</button>`
      : "";

    return `
      <div class="person-card">
        <div class="avatar-wrap">${avatarHtml}</div>
        <div class="card-body">
          <span class="net-tag ${tagClass}">${esc(r.typeLabel)} • ${esc(r.subLevel)}</span>
          <div class="person-name">${esc(fullName)}</div>
          <div class="detail-list">${details}</div>
          <div class="card-actions">${callBtn}${editBtn}</div>
        </div>
      </div>
    `;
  }

  // ==================== DASHBOARD ====================
  function renderDashboard() {
    const total = allRecords.length;
    const cPhet = allRecords.filter(r => r.type === "phet").length;
    const cTsps = allRecords.filter(r => r.type === "tsps").length;
    const cWis  = allRecords.filter(r => r.type === "wisdom").length;

    document.getElementById("statGrid").innerHTML = `
      <div class="stat-card"><div class="s-lbl">รวมทั้งหมด</div><div class="s-val" style="color:#fff">${total}</div></div>
      <div class="stat-card"><div class="s-lbl">ครูเพชรในตม</div><div class="s-val" style="color:var(--phet)">${cPhet}</div></div>
      <div class="stat-card"><div class="s-lbl">สมาชิก ทสปช.</div><div class="s-val" style="color:var(--tsps)">${cTsps}</div></div>
      <div class="stat-card"><div class="s-lbl">ปราชญ์ฯ</div><div class="s-val" style="color:var(--wisdom)">${cWis}</div></div>
    `;

    const distMap = {};
    allRecords.forEach(r => {
      const d = r.district || "ไม่ระบุ";
      const s = r.subdistrict || "-";
      if (!distMap[d]) distMap[d] = { total: 0, phet: 0, tsps: 0, wisdom: 0, subs: {} };
      distMap[d].total++;
      distMap[d][r.type]++;
      if (!distMap[d].subs[s]) distMap[d].subs[s] = { total: 0, phet: 0, tsps: 0, wisdom: 0 };
      distMap[d].subs[s].total++;
      distMap[d].subs[s][r.type]++;
    });

    const special = ["ระดับจังหวัด / ที่ปรึกษา", "กลุ่มนิสิต (ยังไม่ระบุพื้นที่)"];
    const allDist = Object.keys(distMap);
    const ordered = [
      ...special.filter(s => allDist.includes(s)),
      ...allDist.filter(d => !special.includes(d)).sort((a, b) => a.localeCompare(b, "th"))
    ];

    const html = ordered.map(d => {
      const info = distMap[d];
      const subRows = Object.keys(info.subs).sort((a, b) => a.localeCompare(b, "th")).map(s => {
        const si = info.subs[s];
        const label = NON_GEO_SUBDISTRICTS.includes(s) ? s : `ต.${s}`;
        return `
          <div class="subdist-row">
            <span>${esc(label)}</span>
            <span>
              <strong style="color:#fff">${si.total}</strong>
              <span style="color:var(--muted);font-size:12px;">
                (เพชร ${si.phet} / ทสปช. ${si.tsps} / ปราชญ์ ${si.wisdom})
              </span>
            </span>
          </div>
        `;
      }).join("");

      return `
        <div class="dist-acc" onclick="this.classList.toggle('open')">
          <div class="dist-header">
            <div class="dist-name">${esc(d)}</div>
            <div class="dist-badges">
              ${info.phet ? `<span class="mini-badge tag-phet">เพชร ${info.phet}</span>` : ""}
              ${info.tsps ? `<span class="mini-badge tag-tsps">ทสปช. ${info.tsps}</span>` : ""}
              ${info.wisdom ? `<span class="mini-badge tag-wisdom">ปราชญ์ ${info.wisdom}</span>` : ""}
              <span class="mini-badge" style="background:var(--surface-2);color:#fff;">รวม ${info.total}</span>
            </div>
          </div>
          <div class="subdist-body">${subRows}</div>
        </div>
      `;
    }).join("");

    document.getElementById("districtSummary").innerHTML = html;
  }

  // ==================== ADMIN EDIT & CROPPER ====================
  function openEditModal(id) {
    const rec = allRecords.find(r => r.id === id);
    if (!rec) return;
    editingRecord = { ...rec };

    document.getElementById("editPrefix").value = rec.prefix || "";
    document.getElementById("editFirstName").value = rec.firstName || "";
    document.getElementById("editLastName").value = rec.lastName || "";
    document.getElementById("editPosition").value = rec.position || "";
    document.getElementById("editSubdistrict").value = rec.rawSubdistrict || "";
    document.getElementById("editDistrict").value = rec.rawDistrict || "";
    document.getElementById("editPhone").value = rec.phone || "";

    document.getElementById("fieldBatchWrap").style.display = rec.type === "phet" ? "block" : "none";
    document.getElementById("fieldWorkplaceWrap").style.display = rec.type === "phet" ? "block" : "none";
    document.getElementById("fieldWisdomWrap").style.display = rec.type === "wisdom" ? "grid" : "none";

    if (rec.type === "phet") {
      document.getElementById("editBatch").value = rec.batch || "";
      document.getElementById("editWorkplace").value = rec.workplace || "";
    }
    if (rec.type === "wisdom") {
      document.getElementById("editBranch").value = rec.branch || "";
      document.getElementById("editCategory").value = rec.category || "";
      document.getElementById("editKnowledge").value = rec.knowledge || "";
    }

    document.getElementById("editCurrentPhoto").innerHTML = rec.photoUrl
      ? `<img src="${esc(rec.photoUrl)}" alt="current" />`
      : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;">${AVATAR_SVG}</div>`;

    document.getElementById("photoFileInput").value = "";
    document.getElementById("cropContainer").style.display = "none";
    document.getElementById("editStatus").textContent = "";
    if (cropperInstance) { cropperInstance.destroy(); cropperInstance = null; }

    document.getElementById("editModal").classList.add("open");
  }

  function closeEditModal() {
    document.getElementById("editModal").classList.remove("open");
    if (cropperInstance) { cropperInstance.destroy(); cropperInstance = null; }
  }

  function onPhotoSelected(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      const img = document.getElementById("cropImage");
      img.src = e.target.result;
      document.getElementById("cropContainer").style.display = "block";
      if (cropperInstance) cropperInstance.destroy();
      cropperInstance = new Cropper(img, {
        aspectRatio: 3 / 4,
        viewMode: 1,
        dragMode: "move",
        autoCropArea: 0.9,
        responsive: true,
        background: false
      });
    };
    reader.readAsDataURL(file);
  }

  async function saveEditRecord() {
    if (!editingRecord) return;
    const btn = document.getElementById("saveEditBtn");
    const status = document.getElementById("editStatus");
    btn.disabled = true;
    status.textContent = "กำลังบันทึกข้อมูล...";

    editingRecord.prefix = document.getElementById("editPrefix").value.trim();
    editingRecord.firstName = document.getElementById("editFirstName").value.trim();
    editingRecord.lastName = document.getElementById("editLastName").value.trim();
    editingRecord.position = document.getElementById("editPosition").value.trim();
    editingRecord.rawSubdistrict = document.getElementById("editSubdistrict").value.trim();
    editingRecord.rawDistrict = document.getElementById("editDistrict").value.trim();
    editingRecord.phone = document.getElementById("editPhone").value.trim();

    if (editingRecord.type === "phet") {
      editingRecord.batch = document.getElementById("editBatch").value.trim();
      editingRecord.workplace = document.getElementById("editWorkplace").value.trim();
    }
    if (editingRecord.type === "wisdom") {
      editingRecord.branch = document.getElementById("editBranch").value.trim();
      editingRecord.category = document.getElementById("editCategory").value.trim();
      editingRecord.knowledge = document.getElementById("editKnowledge").value.trim();
    }

    let photoBase64 = "";
    if (cropperInstance) {
      status.textContent = "กำลังย่อและอัปโหลดรูปภาพ...";
      const canvas = cropperInstance.getCroppedCanvas({ width: 300, height: 400 });
      photoBase64 = canvas.toDataURL("image/jpeg", 0.85);
    }

    try {
      const res = await apiPost({
        action: "updateRecord",
        pin: currentPin,
        record: editingRecord,
        photoBase64: photoBase64
      });

      if (!res.ok) {
        status.textContent = "บันทึกไม่สำเร็จ: " + (res.error || "");
        return;
      }

      const refreshed = await apiPost({ action: "getData", pin: currentPin });
      if (refreshed.ok) {
        allRecords = (refreshed.records || []).map(r => ({ ...r, subLevel: classifySubLevel(r) }));
      }

      initFilters();
      populateNetSubLevel();
      renderAreaSearch();
      renderNetworkTab();
      renderDashboard();
      closeEditModal();
    } catch (e) {
      status.textContent = "เกิดข้อผิดพลาดในการเชื่อมต่อ";
    } finally {
      btn.disabled = false;
    }
  }

  function openLightbox(url) {
    document.getElementById("lightboxImg").src = url;
    document.getElementById("lightboxModal").classList.add("open");
  }

  function esc(str) {
    return String(str || "").replace(/[&<>"']/g, m => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[m]));
  }
</script>
